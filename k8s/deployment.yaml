apiVersion: apps/v1
kind: Deployment
metadata:
  name: btc-forecast
  labels:
    app: btc-forecast
spec:
  replicas: 3
  selector:
    matchLabels:
      app: btc-forecast
  template:
    metadata:
      labels:
        app: btc-forecast
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: api
          image: hamzamumtaz1524/btc-forecast:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: btc-forecast-config
            - secretRef:
                name: btc-forecast-secret
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: models
              mountPath: /app/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: btc-models-pvc