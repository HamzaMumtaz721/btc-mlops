services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "5001:5000"
    environment:
      RELOAD_API_KEY: demo-key
      MODEL_STAGE: dev
    volumes:
      - ./models:/app/models

  airflow:
    image: apache/airflow:2.9.3-python3.10
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "yfinance scikit-learn==1.5.1 joblib==1.4.2 requests"
      PYTHONPATH: /opt/airflow
      API_URL: http://api:5000
      RELOAD_API_KEY: demo-key
      MODEL_DIR: /opt/airflow/models
      DATA_DIR: /opt/airflow/data
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models
    ports:
      - "8080:8080"
    command:
      - bash
      - -c
      - >
        airflow db migrate &&
        airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email a@b.com ;
        airflow scheduler & exec airflow webserver